<!DOCTYPE html>
<html lang="ko">
<head>

<title>토끼 병사단의 야영지 · 모바일</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#140d08;font-family:monospace;color:#a87c52;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #wrap{position:relative;box-shadow:0 0 0 3px #5c3d24,0 0 30px #000}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;
      background:rgba(20,13,8,.62);color:#f6e8c4;text-align:center;font-size:18px;letter-spacing:1px;padding:0 1em;
      text-shadow:2px 2px 0 #1e130c;line-height:1.45}
  #ov.hide{display:none}
  #ov b{color:#f2c35a;font-size:1.6em}
  #ov small{color:#c9a273;font-size:.62em}
  #ov .tap{animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #msg{position:absolute;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);width:42%;margin:0;
    color:#e6cc9c;font-size:12px;line-height:1.35;text-align:center;text-shadow:1px 1px 0 #1e130c,0 0 4px #1e130c;
    pointer-events:none;z-index:5}
  body.port{justify-content:flex-start;padding-top:max(10px,env(safe-area-inset-top))}
  body.port #msg{position:static;transform:none;width:auto;margin:12px 16px 0;font-size:14px;min-height:2.8em}
  /* ---- 터치 조작 ---- */
  #ctrl{position:absolute;inset:0;pointer-events:none;z-index:10}
  #zone{position:absolute;left:0;bottom:0;width:50%;top:30%;pointer-events:auto}
  #stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
    background:rgba(246,232,196,.10);border:3px solid rgba(246,232,196,.35);pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(242,195,90,.55);border:3px solid rgba(30,19,12,.7)}
  .btn{position:absolute;border-radius:50%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#f6e8c4;font-weight:bold;text-shadow:2px 2px 0 #1e130c;border:3px solid #1e130c;box-shadow:0 0 0 3px #5c3d24;line-height:1.1}
  .btn.down{transform:scale(.92);filter:brightness(1.3)}
  .btn span{font-size:11px;font-weight:normal}
  #btnA{width:84px;height:84px;font-size:20px;background:rgba(178,74,34,.75)}
  #btnE{width:70px;height:70px;font-size:26px;background:rgba(95,102,52,.75)}
  #btnE.ready{background:rgba(242,195,90,.9);color:#1e130c;text-shadow:none;animation:pulse .6s ease-in-out infinite alternate}
  @keyframes pulse{to{box-shadow:0 0 0 3px #5c3d24,0 0 18px 6px rgba(242,195,90,.7)}}
  .sm{position:absolute;width:40px;height:40px;border-radius:10px;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#f6e8c4;background:rgba(59,38,24,.8);border:2px solid #5c3d24}
  .sm.down{filter:brightness(1.5)}
  #rot{display:none;text-align:center;font-size:12px;color:#80583a;margin-top:4px}
  body.port #rot{display:block}
  /* 가로 화면 배치 */
  #btnA{right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px)}
  #btnE{right:calc(env(safe-area-inset-right) + 118px);bottom:calc(env(safe-area-inset-bottom) + 64px)}
  #btnR{left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px)}
  #btnFS{left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 58px)}
  /* 세로 화면 배치 (게임 화면 아래쪽에 조작부) */
  body.port #btnA{width:96px;height:96px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 70px)}
  body.port #btnE{width:78px;height:78px;right:134px;bottom:calc(env(safe-area-inset-bottom) + 150px)}
  body.port #btnR{left:auto;top:auto;right:calc(50% + 6px);bottom:calc(env(safe-area-inset-bottom) + 16px)}
  body.port #btnFS{left:calc(50% + 6px);top:auto;bottom:calc(env(safe-area-inset-bottom) + 16px)}
</style>

<div id="ctrl">
  <div id="zone"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="btnA"><div id="labA">작살</div><span id="subA">던지기</span></div>
  <div class="btn" id="btnE">E<span id="subE">행동</span></div>
  <div class="sm" id="btnR" title="다시 시작">↻</div>
  <div class="sm" id="btnFS" title="전체 화면">⛶</div>
</div>
<script>
const W = 192, H = 108;                       // 화면(카메라) 크기
const XMIN = -96, X1 = 288, XMAX = 576, WW = XMAX - XMIN; // 1부 영역은 -96~288, 2부 약초 전장은 그 오른쪽(288~576)
const GX = 384;                                // 약초 전장(절구) 중심 x
let PART = 1;                                  // 1: 멧돼지 타임어택, 2: 약초 전장

// ---------- 제한된 세피아 팔레트 (22색) ----------
const HEX = ['000000',
  '1e130c','3b2618','5c3d24','80583a','a87c52','c9a273','e6cc9c','f6e8c4', // 1-8 브라운 램프
  '2b3018','434a26','5f6634','808446','a3a35e',                            // 9-13 올리브 그린
  '5a5248','7d7363','a39882',                                              // 14-16 돌
  'fff2b8','f2c35a','e0822e','b24a22',                                     // 17-20 불꽃
  '8a2e1e','c4553a'];                                                      // 21-22 붉은 천
const RGB = HEX.map(h => [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]);
// 조명용 램프 이동 테이블 (색을 섞지 않고 팔레트 안에서만 밝기 변경)
const DARK  = [0,1,1,2,3,4,5,6,7,1,9,10,11,12,2,14,15,18,19,20,21,2,21];
const LIGHT = [0,1,3,4,5,6,7,8,8,10,11,12,13,13,15,16,16,17,17,18,19,22,22];
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const base = new Uint8Array(WW*H), fg = new Uint8Array(WW*H), buf = new Uint8Array(WW*H);
let cur = base;
function set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<XMIN||y<0||x>=XMAX||y>=H||!c)return;cur[y*WW+x-XMIN]=c;}
function get(x,y){return (x<XMIN||y<0||x>=XMAX||y>=H)?0:cur[y*WW+x-XMIN];}
function ellipse(cx,cy,rx,ry,c){
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
    for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const dx=(x-cx)/(rx+0.4), dy=(y-cy)/(ry+0.4);
      if(dx*dx+dy*dy<=1) set(x,y,c);
    }
}
const circle=(cx,cy,r,c)=>ellipse(cx,cy,r,r,c);

// ---------- 스프라이트 (자동 두꺼운 외곽선) ----------
const DEFMAP = {w:7,W:6,p:5,e:1,n:22,h:16,H:15,r:21,R:22,b:3,l:4,s:4,t:16,k:16,K:14};
function sprite(rows,map,ox,oy,flip,pf){
  const set=pf||window.set;
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const m=Object.assign({},DEFMAP,map||{});
  const at=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return '.';const c=rows[y][flip?w-1-x:x];return c===undefined?'.':c;};
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
    if(at(x,y)!=='.')continue;
    if(at(x-1,y)!=='.'||at(x+1,y)!=='.'||at(x,y-1)!=='.'||at(x,y+1)!=='.') set(ox+x,oy+y,1);
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=at(x,y);if(c!=='.')set(ox+x,oy+y,m[c]);}
}

const SOLDIER=[
"..ww.ww...t.",
"..wp.wp..ttt",
"..wp.wp...t.",
"..wp.wp...s.",
"..ww.ww...s.",
".hhhhhhh..s.",
"hhHHHHHhh.s.",
".wwwwwwww.s.",
".wwwwwwew.s.",
".Wwwwwwwn.s.",
"..WWwwwW..s.",
".rrRRRrr..s.",
"rrrRRRrrrws.",
"rrbbbbbrr.s.",
".rrrrrrr..s.",
".ll...ll..s.",
".ll...ll..s.",
"WWW..WWW..s."];
// 걷기 프레임 (다리만 교체)
const SOLDIER_W1=SOLDIER.slice(0,15).concat([".ll..ll...s.","ll....ll..s.","WW.....WW.s."]);
const SOLDIER_W2=SOLDIER.slice(0,15).concat(["..llll....s.","..llll....s.","..WWWW....s."]);
const WALK=[SOLDIER,SOLDIER_W1,SOLDIER,SOLDIER_W2];
const SIT=[
"..ww.ww...",
"..wp.wp...",
"..wp.wp...",
"..ww.ww...",
".wwwwwww..",
".wwwwwew..",
".Wwwwwwn..",
"..WWwwW...",
".rrRRRr...",
"rrrRRRrrww",
"rrrrrrrr..",
".WWWWWWWW."];
const MINION=[
".w....w.",
".ww..ww.",
"..wwww..",
".wwwwww.",
".wewwew.",
".wwWWww.",
"..wwww..",
"..W..W.."];
const STONE=[".aa.","abbb","bbbc"];
const LOGS=["6443....3446","744433334447",".3344444433.","..22222222.."];
const STICK=["4.4","4.4",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4.",".4."];
const CARROT=["..cccgg","cCccccg","..cccgg"];
const CRATE=["555555","544445","545545","554455","545545","544445","555555"];
const DUMMY=["..666..",".67776.",".67176.",".67776.","6666666","..666..","..636..","...3...","...3...","...3...","..333.."];
// --- 사냥 관련 스프라이트 ---
const WALK_EMPTY=WALK.map(r=>r.map(s=>s.replace(/[st]/g,'.')));   // 작살을 던진 뒤 빈손
const BOAR_A=["..bbbbb.....",".bBBBBBbb...","bBBBBBBBBbb.","bBBBBBBBBebb","bBBBBBBBBBbn",".bBBBBBBBbT.","..l.l..l.l..","..l.l..l.l.."];
const BOAR_B=BOAR_A.slice(0,6).concat([".l..l..l..l.",".l..l..l..l."]);
const BIRD_A=["....hh..","...hhep.","tbbbbh..","ttbBBbb.",".bbbbbb.","...l.l.."];
const BIRD_B=BIRD_A.slice(0,5).concat(["..l...l."]);
const PREY={
  boar:{f:[BOAR_A,BOAR_B],m:{b:4,B:5,e:1,n:6,T:8,l:3},w:12,h:8,spd:13,flee:36,name:'멧돼지',obj:'멧돼지를'},
  bird:{f:[BIRD_A,BIRD_B],m:{h:22,e:1,p:18,b:5,B:6,t:4,l:3},w:8,h:6,spd:10,flee:44,name:'숲꿩',obj:'숲꿩을'}
};
const MEAT=["..mmm...",".mMmmmbb",".mmmmm.o","..mmm..."];
const ICON_MEAT=[".mm..","mMmmo",".mm.."];
const FONT={0:"111101101101111",1:"010110010010111",2:"111001111100111",3:"111001111001111",4:"101101111001001",
  5:"111100111001111",6:"111100111101111",7:"111001001001001",8:"111101111101111",9:"111101111001111",E:"111100111100111",F:"111100111100100",'/':"001001010100100",x:"000101010101000",
  P:"111101111100100",A:"010101111101101",R:"110101110101101",T:"111010010010010"};
function text(str,x,y,c,pf){for(const ch of String(str)){const g=FONT[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1')pf(x+i%3,y+(i/3|0),c);x+=4;}}
const TORCH=[".2.",".3.",".3.",".3.",".3.",".3.",".3.",".3.",".3.",".3.",".3.","333"];
// --- 2부 스프라이트 ---
const rotCW=r=>{const h=r.length,w=r[0].length;return Array.from({length:w},(_,y)=>Array.from({length:h},(_,x)=>r[h-1-x][y]).join(''));};
const SIT_DOWN=rotCW(SIT);                                  // 옆으로 쓰러진 토끼
const ARROW=["....a...","....aa..","aaaaaaa.","aaaaaaaa","aaaaaaa.","....aa..","....a..."];
const ARROW_DOWN=rotCW(ARROW);                              // ↓ 화살표 (도구 걸이 표시)
const MORTAR=[
".HHHHHHHHHHHHHH.",
"HgGggGgggGggGgdH",
"HHhhhhhhhhhhhhdd",
".Hhhhhhhhhhhhdd.",
".Hhhhhhhhhhhhdd.",
"..hhhhhhhhhhdd..",
"...hhhhhhhhdd...",
"..HHhhhhhhhhdd..",
".HHHHhhhhhhhddd."];
const BASKET=[".gGgGg.","gGgggGg","bBbBbBb","BbBbBbB",".bBbBb."];
const BASKET_M=[".rRr.r.","rRrrRrr","bBbBbBb","BbBbBbB",".bBbBb."];
const BASKET_MAP={g:12,G:13,b:4,B:5,r:21,R:22};
const MUSH=[".rrr.","rRrRr","..w.."];
const HERB=["g.g","GgG",".b."];
const PUFF=[".pp.","pPpp","pppp"];
const BOARD=["66666666","55555555",".3....3."];
// 괭이: 자루 끝에 ㄱ자 날 (걷기 프레임에서 작살 대신)
const WALK_HOE=WALK.map(fr=>["..ww.ww...sk","..wp.wp...sk","..wp.wp...sK"].concat(fr.slice(3)));
const HOE_SPR=["sk","sk","sK","s.","s.","s.","s.","s.","s.","s.","s.","s.","s."];
const HARPOON_SPR=[".t.","ttt",".t.",".s.",".s.",".s.",".s.",".s.",".s.",".s.",".s.",".s.",".s.",".s."];
const HOE_ICON=["ssssssssk","........k","........K"];
// 캘 수 있는 약초 / 독버섯
const HERB_PLANT=["..y..",".gyg.","gGgGg",".gGg.",".ddd."];
const HERB_MAP={y:18,g:12,G:13,d:4};
const HERB_ICON=[".y.","gyg","GgG"];
const POISON=[".rRRr.","rRsRsr","rrrrrr","..ww..","..ww.."];
const POISON_MAP={r:21,R:22,s:8,w:7};
const BUBBLE_HERB=["..g.g..",".gGgGg.","gGgGgGg",".gGgGg.","..gbg..","...b...","...b..."];   // 말풍선 속 약초
const BOTTLE=[".c.",".s.","sGs","sgs","sss"];               // 약병
const BOTTLE_MAP={c:4,s:16,G:13,g:12};

// ---------- 배경 구성 요소 ----------
const R = rng(7);
function tree(x,baseY,r,dark){
  const top=baseY-r*2.2;
  for(let y=Math.round(top);y<=baseY;y++)for(let dx=-2;dx<=2;dx++)
    set(x+dx,y,(dx===-2||dx===2)?1:(dx===1?2:3));
  set(x-3,baseY,1);set(x+3,baseY,1);
  const cs=[[x,top-r*0.3,r],[x-r*0.75,top+r*0.35,r*0.72],[x+r*0.75,top+r*0.35,r*0.72],[x,top-r*1.1,r*0.6]];
  cs.forEach(([a,b,q])=>circle(a,b,q+1,1));
  cs.forEach(([a,b,q])=>circle(a,b,q,dark?9:10));
  cs.forEach(([a,b,q])=>circle(a-1,b-1,q-1.5,dark?10:11));
  cs.forEach(([a,b,q])=>circle(a-q*0.35,b-q*0.4,q*0.42,dark?11:12));
  cs.forEach(([a,b,q])=>{for(let i=0;i<q*1.2;i++){const an=R()*6.28,d=R()*q*0.75,px=a+Math.cos(an)*d,py=b-Math.abs(Math.sin(an)*d);if(get(Math.round(px),Math.round(py))!==1)set(px,py,dark?12:13);}});
}
function bush(x,y,r){
  const cs=[[x,y,r],[x-r*0.8,y+1,r*0.7],[x+r*0.8,y+1,r*0.7]];
  cs.forEach(([a,b,q])=>circle(a,b,q+1,1));
  cs.forEach(([a,b,q])=>circle(a,b,q,9));
  cs.forEach(([a,b,q])=>circle(a-1,b-1,q-1.5,10));
  cs.forEach(([a,b,q])=>circle(a-q*0.3,b-q*0.4,q*0.4,11));
}
function tent(cx,baseY,w,h,c1,c2){
  for(let k=-1;k<=h+1;k++){const y=baseY-h+k, half=Math.max(0,k)*w/2/h+1;for(let dx=-Math.ceil(half);dx<=Math.ceil(half);dx++)set(cx+dx,y,1);}
  for(let k=0;k<=h;k++){const y=baseY-h+k, half=k*w/2/h;for(let dx=-Math.floor(half);dx<=Math.floor(half);dx++)set(cx+dx,y,dx<0?c1:c2);}
  for(let k=0;k<6;k++){const y=baseY-5+k, half=k*0.6;for(let dx=-Math.round(half);dx<=Math.round(half);dx++)set(cx+dx,y,dx===0?1:2);}
  for(let k=1;k<=3;k++)set(cx,baseY-h-k,3);set(cx,baseY-h-4,1);
}
function fence(x0,x1,y){
  for(const ry of [y-2,y-5]){for(let x=x0;x<=x1;x++){set(x,ry-1,1);set(x,ry,5);set(x,ry+1,1);}}
  for(let x=x0;x<=x1;x+=7){for(let k=-1;k<=8;k++){set(x-1,y-k,1);set(x+1,y-k,1);}for(let k=0;k<8;k++)set(x,y-k,k>5?6:4);set(x,y-8,1);}
}
function stump(x,y){
  ellipse(x,y+2,5,3,1);ellipse(x,y+2,4,2,2);
  for(let dx=-4;dx<=4;dx++)for(let k=0;k<3;k++)set(x+dx,y+k,dx>1?2:3);
  ellipse(x,y-1,5,2.2,1);ellipse(x,y-1,4,1.4,6);ellipse(x,y-1,2,0.6,5);set(x,y-1,4);
}
function boulder(x,y,rx,ry){
  ellipse(x,y,rx+1,ry+1,1);ellipse(x,y,rx,ry,14);
  ellipse(x-1,y-1,rx-1,ry-1,15);ellipse(x-rx*0.4,y-ry*0.45,rx*0.35,ry*0.3,16);
}

// ---------- 정적 배경 렌더 ----------
cur=base;
for(let y=0;y<H;y++)for(let x=XMIN;x<XMAX;x++){           // 디더링된 노을 하늘
  const v=y/44*2.4+BAYER[y&3][x&3]/16-0.5;
  set(x,y,[5,6,7][Math.max(0,Math.min(2,Math.floor(v)))]);
}
circle(146,30,7,7);circle(146,30,5.5,8);                   // 낮은 해
[[-60,11,16,1.5],[-10,20,9,1],[40,14,14,1.5],[118,9,18,1.5],[172,19,10,1],[236,12,15,1.5],[270,22,8,1]].forEach(([x,y,rx,ry])=>{ellipse(x,y,rx,ry,7);for(let i=-rx+2;i<rx-2;i++)set(x+i,y+ry+1,6);});
const lines=[[30,12,11,13,[4,0.21,3,0.07,2,0.5]],[42,11,10,12,[4,0.17,2,0.11,2,0.43]],[52,10,9,11,[3,0.25,2,0.09,1,0.6]]];
for(const [b,fill,edge,spk,k] of lines){                    // 겹겹이 쌓인 숲 실루엣
  for(let x=XMIN;x<XMAX;x++){
    const top=Math.round(b+k[0]*Math.sin(x*k[1])+k[2]*Math.sin(x*k[3]+1)+k[4]*Math.sin(x*k[5]));
    for(let y=top;y<62;y++)set(x,y,y===top?edge:(y<top+3&&R()<0.25?spk:fill));

  if(G.state!=='play'&&!(G.state==='part2'&&G.p2!=='ready'&&G.p2!=='lose')){P.moving=false;P.walk=0;return;}
  if(G.dizzy>0)G.dizzy-=dt;

  const mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  const my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  const sp=40*dt*(mx&&my?0.707:1);
  P.moving=!!(mx||my);
  if(mx)P.flip=mx<0;
  if(!blocked(P.x+mx*sp,P.y))P.x+=mx*sp;

  P.walk=P.moving?P.walk+dt*9:0;
}

function endGame(win){
  G.state=win?'seq':'lose';
  if(win){
    const used=TIME_LIMIT-G.time, record=!G.best||used<G.best;
    if(record){G.best=used;localStorage.setItem('rabbitBoarBest_v1',used.toFixed(2));}
    showOverlay(`<b>성공!</b><div>멧돼지 ${GOAL}마리를 ${fmt(used)} 만에 구웠다</div>`+
      `<small>${record?'★ 새 최고 기록! ★':'최고 기록 '+fmt(G.best)}</small>`);
    G.ovT=FEAST0; G.seq=0; G.feastN=inv.cooked;
    if(HP.prey)HP.prey.state='alive';                       // 날아가던 작살은 회수
    Object.assign(HP,{state:'held',prey:null});
    setMsg('성공! 이제 잔치를 벌이자');
  }else{
    showOverlay(`<b>시간 종료</b><div>구운 멧돼지 ${G.score} / ${GOAL}</div>`+
      `<small>팁: 고기를 여러 개 모아서 한 번에 구우면 빨라요</small><div class="tap">터치해서 다시 하기</div>`);
    setMsg('시간이 다 됐다...');
  }
}
function updateGame(dt){
  if(G.ovT>0){G.ovT-=dt;if(G.ovT<=0)ovEl.classList.add('hide');}
  if(G.state==='play'){
    G.time=Math.max(0,G.time-dt);
    if(G.time<=0)endGame(false);
    return;
  }
  if(G.state==='seq'){
    const s0=G.seq, s=G.seq+=dt, cross=k=>s0<k&&s>=k;
    if(cross(FEAST0))setMsg('잔치다! 다 같이 구운 멧돼지를 먹자 냠냠');
    if(s>=FEAST0&&s<FEAST1)inv.cooked=Math.ceil(G.feastN*(1-(s-FEAST0)/(FEAST1-FEAST0)));
    if(cross(FEAST1)){inv.cooked=0;setMsg('고기를 다 먹었다! ...어? 갈색 토끼 상태가 이상하다');}
    if(cross(FALL))setMsg('앗! 갈색 토끼가 쓰러졌다!!');
    if(cross(BUBBLE))setMsg('갈색 토끼: "야... 약초가... 필요해..."');
    if(cross(P2)){
      PART=2;G.state='part2';G.p2='walk';
      showOverlay('<b>PART 2</b><div>약초 전장</div><small>쓰러진 토끼를 위해 숲 속 약초 전장으로 가자</small>');
      G.ovT=2.8;
      setMsg('약초가 필요해! 오른쪽 숲으로 쭉 가자 → (조이스틱)');
    }
    return;
  }
  if(G.state!=='part2')return;
  if(!G.rackHint&&nearRack()){G.rackHint=true;setMsg('도구 걸이다! E 버튼을 눌러 작살을 괭이로 바꾸자');}
  if(!G.arrived&&P.x+6>=GX-60){
    G.arrived=true;
    if(G.p2==='walk')setMsg('약초 전장 도착! 약초를 캐려면 괭이가 필요해 (뒤쪽 도구 걸이에서 E 버튼)');
  }
  if(G.p2==='run'){
    G.p2time=Math.max(0,G.p2time-dt);
    for(let i=G.herbQ.length-1;i>=0;i--)if((G.herbQ[i]-=dt)<=0){G.herbQ.splice(i,1);spawnHerb();}   // 캔 자리엔 새 약초가 돋아남
    updateMortar(dt);
    if(G.p2time<=0)p2Lose();
  }
  if(G.p2==='end'){
    const c0=G.cureT;G.cureT+=dt;
    if(c0<CURE&&G.cureT>=CURE)setMsg('갈색 토끼가 벌떡 일어났다! "고마워! 이제 다 나았어!"');
    if(c0<END_OV&&G.cureT>=END_OV){
      showOverlay('<b>PART 2 클리어!</b><div>약병을 먹은 갈색 토끼가 기운을 되찾았다</div>'+
        `<small>멧돼지 최고 기록 ${G.best?fmt(G.best):'-'} · 약초 최고 기록 ${G.best2?fmt(G.best2):'-'}</small><div class="tap">터치해서 처음부터</div>`);
      G.ovT=0;
    }
  }
}
function nearBrown(){const b=ents.find(e=>e.brown);return Math.hypot(P.x+6-(b.x+5),(P.y+18-(b.y+11))*1.5)<24;}
function giveMedicine(){                                    // 약병을 쓰러진 토끼에게 건네기
  G.bottle=false;G.p2='end';G.cureT=0;
  setMsg('약병을 건넸다! 갈색 토끼가 꿀꺽꿀꺽 마신다...');
}

// ---------- 2부: 약초 타임어택 진행 ----------
function p2Ready(){
  G.p2='ready';
  showOverlay(`<b>약초 타임어택</b><div>${P2_LIMIT}초 안에 약초 ${P2_GOAL}개를 캐서 절구로 약을 만들어라!</div>`+
    `<small>괭이 버튼으로 캐기 · 절구 옆에서 E 버튼으로 넣기/꺼내기<br>다 빻은 약은 ${SPOIL-MAKE}초 안에 꺼내야 해요 (늦으면 약효가 떨어짐) · 빨간 독버섯 주의</small>`+
    (G.best2?`<small>최고 기록 ${fmt(G.best2)}</small>`:'')+`<div class="tap">화면을 터치해서 시작</div>`);
  G.ovT=0;
}
function p2Start(){
  G.p2='run';G.p2time=P2_LIMIT;G.med=0;
  ovEl.classList.add('hide');
  setMsg(`시작! 약초 ${P2_GOAL}개로 약을 만들어라`);
}
function p2Retry(){                                         // 2부만 다시 (도구 걸이 앞에서, 괭이 든 채로)
  placeHerbs();inv.herb=0;mort=null;G.herbQ.length=0;G.dizzy=0;HO.t=-1;
  P.tool='hoe';P.x=294;P.y=65;P.flip=false;camX=camTarget();
  p2Ready();
}
function p2Win(){
  G.p2='done';G.bottle=true;
  const used=P2_LIMIT-G.p2time, record=!G.best2||used<G.best2;
  if(record){G.best2=used;localStorage.setItem('rabbitHerbBest_v1',used.toFixed(2));}
  showOverlay(`<b>약병 획득!</b><div>약초 ${P2_GOAL}개로 약을 만들어 약병을 얻었다 (${fmt(used)})</div>`+
    `<small>${record?'★ 새 최고 기록! ★':'최고 기록 '+fmt(G.best2)}</small>`);
  G.ovT=3.5;
  setMsg('약병을 얻었다! 모닥불 옆에 쓰러진 갈색 토끼에게 가져가서 E 버튼으로 주자 ←');
}
function p2Lose(){
  G.p2='lose';mort=null;
  showOverlay(`<b>시간 종료</b><div>만든 약 ${G.med} / ${P2_GOAL}</div>`+
    `<small>팁: 약초를 여러 개 모아서 한 번에 넣고, 다 되면 바로 꺼내세요</small><div class="tap">터치해서 다시 도전</div>`);
  setMsg('시간이 다 됐다... 약이 부족해');
}
function nearMortar(){return Math.hypot(P.x+6-GX,(P.y+18-92)*2)<38;}
function mortarAction(){
  if(mort){
    if(mort.t<MAKE){setMsg('아직 빻는 중... ('+Math.ceil(MAKE-mort.t)+'초)');return;}
    const n=mort.n;G.med+=n;mort=null;
    if(G.med>=P2_GOAL){p2Win();return;}
    setMsg(`약 ${n}개분을 꺼냈다! (${G.med} / ${P2_GOAL})`);
    if(inv.herb>0)mortarAction();                           // 들고 있던 약초는 바로 이어서 넣기
    return;
  }
  if(inv.herb>0){mort={t:0,n:inv.herb};inv.herb=0;setMsg(`절구에 약초 ${mort.n}개를 넣었다. 쿵덕쿵덕... (${MAKE}초)`);}
  else setMsg('넣을 약초가 없어요. 괭이 버튼으로 약초를 캐자!');
}
function updateMortar(dt){
  if(!mort)return;
  mort.t+=dt;
  if(!mort.done&&mort.t>=MAKE){mort.done=true;setMsg('약이 다 됐다! 절구 옆에서 E 버튼으로 꺼내기 (늦으면 약효가 떨어져요)');}
  if(!mort.warn&&mort.t>=SPOIL-2){mort.warn=true;setMsg('약효가 떨어지고 있다!! 빨리 꺼내야 해');}
  if(mort.t>=SPOIL){setMsg(`앗, 늦었다! 약효가 떨어져서 약초 ${mort.n}개분을 못 쓰게 됐다...`);mort=null;}
}
function spawnHerb(){                                       // 비어 있는 땅에 약초 하나 새로 돋기
  let x,y,ok=false;
  for(let gap=HERB_GAP;!ok&&gap>=8;gap-=4)                  // 자리가 없으면 간격을 조금씩 줄여서 다시
    for(let k=0;k<60&&!ok;k++){
      x=310+Math.round(ER()*(XMAX-326));y=74+Math.round(ER()*32);
      const a=(x-GX)/31,b=(y-92)/10;
      ok=a*a+b*b>=1&&!(x>408&&x<438&&y>80&&y<99)&&!(x>328&&x<352&&y<86)&&
         Math.hypot(x-(P.x+6),y-(P.y+18))>14&&
         ents.every(e=>!(e.herb||e.poison)||Math.hypot(e.x+3-x,(e.y+e.h-y)*1.4)>(e.herb?gap:12));
    }
  ents.push({herb:true,s:HERB_PLANT,m:HERB_MAP,x:x-2,y:y-HERB_PLANT.length+1,h:HERB_PLANT.length});
}

// ---------- 2부: 괭이 & 약초 캐기 ----------
function nearRack(){return Math.hypot(P.x+6-(RACK.x+5),(P.y+18-(RACK.y+15))*1.5)<16;}
function swapTool(){
  P.tool=P.tool==='hoe'?'harpoon':'hoe';
  setMsg(P.tool==='hoe'?'작살을 걸어두고 괭이를 들었다! 괭이 버튼으로 약초를 캐자':'괭이를 걸어두고 작살을 들었다');
  if(P.tool==='hoe'&&G.p2==='walk')p2Ready();              // 처음 괭이를 들면 약초 타임어택 준비
}
function swingHoe(){
  if(HO.t>=0||G.dizzy>0)return;
  if(P.tool!=='hoe'){setMsg('작살로는 약초를 캘 수 없어. 도구 걸이에서 E 버튼을 눌러 괭이로 바꾸자');return;}
  if(G.p2!=='run'&&G.p2!=='done')return;
  HO.t=0;HO.hit=false;
}
function digHit(){                                          // 괭이 날이 땅에 닿는 순간
  const tx=P.x+6+(P.flip?-11:11), ty=P.y+18;
  for(let i=0;i<6;i++)specks.push({x:tx+(ER()-0.5)*4,y:ty-1,vx:(ER()-0.5)*1.2,vy:-0.8-ER()*0.8,life:3+ER()*3,c:ER()<0.5?4:3});
  let best=null,bd=10;
  for(const e of ents)if(e.herb||e.poison){
    const d=Math.hypot(e.x+e.s[0].length/2-tx,(e.y+e.h-ty)*1.5);if(d<bd){bd=d;best=e;}}
  if(!best){setMsg('흙만 팠다... 약초 바로 앞에서 괭이 버튼');return;}
  if(best.herb){
    ents.splice(ents.indexOf(best),1);inv.herb++;
    if(G.p2==='run')G.herbQ.push(HERB_RESPAWN);
    for(let i=0;i<6;i++)specks.push({x:tx+(ER()-0.5)*4,y:ty-3,vx:(ER()-0.5)*1,vy:-1-ER(),life:4+ER()*3,c:ER()<0.5?12:13});
    setMsg(`약초를 캤다! 들고 있는 약초 ${inv.herb}개 → 절구 옆에서 E 버튼으로 넣기`);
  }else{
    G.dizzy=1.5;
    setMsg('으악, 독버섯이다! 어질어질... 빨간 버섯은 캐면 안 돼');
  }
}
function updateHoe(dt){
  if(HO.t<0)return;
  HO.t+=dt;
  if(!HO.hit&&HO.t>=0.18){HO.hit=true;digHit();}
  if(HO.t>=0.36)HO.t=-1;
}

const preys=[], GR=rng(1234);
let respawnT=0;
function inCamp(x,y){const a=(x-96)/62,b=(y-84)/26;return a*a+b*b<1;}
function spawnPrey(initial){
  const type='boar', T=PREY[type];
  let x,y,tries=0;
  do{                                                       // 서쪽/동쪽 숲. 리스폰은 숲 가장자리(위쪽)에서 걸어나옴
    x=GR()<0.5?XMIN+16+GR()*(16-XMIN-16):172+GR()*(X1-30-172);
    y=(initial?70+GR()*34:66+GR()*6)-T.h;
  }while(++tries<20&&Math.hypot(x+T.w/2-(P.x+6),y+T.h-(P.y+18))<50);   // 토끼 바로 옆엔 안 생김
  preys.push({type,x,y,h:T.h,vx:0,vy:initial?0:1,t:initial?0:1,flip:GR()<0.5,walk:0,state:'alive'});
}
for(let i=0;i<MAX_PREY;i++)spawnPrey(true);

function updatePreys(dt){
  const pfx=P.x+6, pfy=P.y+18;
  for(const p of preys){
    const T=PREY[p.type];
    if(p.state==='caught'){p.x=HP.x-T.w/2;p.y=HP.y-T.h/2;continue;}
    const dx=p.x+T.w/2-pfx, dy=p.y+T.h-pfy, d=Math.hypot(dx,dy)||1;
    let sp=T.spd;
    if(d<T.flee){p.vx=dx/d;p.vy=dy/d*0.6;sp*=3;p.t=0.5;}    // 토끼가 다가오면 도망
    else{p.t-=dt;if(p.t<=0){if(GR()<0.35){p.vx=0;p.vy=0;}else{const a=GR()*6.28;p.vx=Math.cos(a);p.vy=Math.sin(a)*0.5;}p.t=1+GR()*2.5;}}
    const ok=(x,y)=>{const fy=y+T.h;return fy>=65&&fy<=106&&x>=XMIN+14&&x+T.w<=X1-14&&!inCamp(x+T.w/2,fy);};
    const nx=p.x+p.vx*sp*dt, ny=p.y+p.vy*sp*dt;
    if(ok(nx,p.y))p.x=nx;else p.vx*=-1;
    if(ok(p.x,ny))p.y=ny;else p.vy*=-1;
    if(p.vx)p.flip=p.vx<0;
    p.walk=(p.vx||p.vy)?p.walk+dt*sp*0.4:0;
  }
  if(preys.filter(p=>p.state==='alive').length<MAX_PREY){respawnT+=dt;if(respawnT>RESPAWN){respawnT=0;spawnPrey(false);}}
}

// 작살: 밧줄이 달려 있어 던지면 날아갔다가 되감김. 맞히면 사냥감을 끌고 옴
const HP={state:'held',x:0,y:0,dx:1,dy:0,dist:0,prey:null};
const handPos=()=>({x:P.x+(P.flip?1:10),y:P.y+11});
function throwHarpoon(){
  if(HP.state!=='held')return;
  let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  const my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(!mx&&!my)mx=P.flip?-1:1;
  const l=Math.hypot(mx,my),h=handPos();
  Object.assign(HP,{dx:mx/l,dy:my/l,x:h.x,y:h.y,dist:0,state:'out',prey:null});
}
function updateHarpoon(dt){
  if(HP.state==='out'){
    const s=150*dt;HP.x+=HP.dx*s;HP.y+=HP.dy*s;HP.dist+=s;
    for(const p of preys){
      if(p.state!=='alive')continue;const T=PREY[p.type];
      if(HP.x>=p.x-1&&HP.x<=p.x+T.w+1&&HP.y>=p.y-1&&HP.y<=p.y+T.h+1){p.state='caught';HP.prey=p;HP.state='back';setMsg(T.name+' 명중!');break;}
    }
    if(HP.state==='out'&&(HP.dist>=90||HP.x<XMIN+2||HP.x>XMAX-2||HP.y<40||HP.y>H-1))HP.state='back';
  }else if(HP.state==='back'){
    const h=handPos(),dx=h.x-HP.x,dy=h.y-HP.y,d=Math.hypot(dx,dy),s=(HP.prey?150:190)*dt;
    if(d<=s+1){
      HP.state='held';
      if(HP.prey){const T=PREY[HP.prey.type];preys.splice(preys.indexOf(HP.prey),1);HP.prey=null;inv.raw++;
        setMsg(T.obj+' 잡았다! 날고기 +1 → 모닥불 옆에서 E 버튼으로 굽기');}
    }else{HP.x+=dx/d*s;HP.y+=dy/d*s;HP.dx=-dx/d;HP.dy=-dy/d;}
  }
}
function nearFire(){const a=(P.x+6-96)/26,b=(P.y+18-87)/13;return a*a+b*b<1;}
function canAct(){
  if(G.state==='part2'){
    if(G.p2==='end')return false;
    if(G.p2==='done'&&G.bottle)return nearBrown();          // 약병 들고 있을 땐 쓰러진 토끼 옆에서만 [E]
    return nearRack()||(G.p2==='run'&&nearMortar()&&(mort?mort.t>=MAKE:inv.herb>0));
  }
  return G.state==='play'&&nearFire()&&(cook?cook.t>=COOK:inv.raw>0);
}
function action(){
  if(!nearFire()){setMsg(inv.raw?'모닥불 가까이 가서 E 버튼을 눌러 구우세요':'모닥불 옆에서만 구울 수 있어요');return;}
  if(cook){
    if(cook.t<COOK){setMsg('아직 굽는 중... ('+Math.ceil(COOK-cook.t)+'초)');return;}
    if(cook.t<BURN){
      inv.cooked+=cook.n;G.score+=cook.n;
      setMsg(`구운 멧돼지 ${cook.n}개 획득! (${Math.min(G.score,GOAL)} / ${GOAL})`);
      cook=null;
      if(G.score>=GOAL)endGame(true);
      else if(inv.raw>0)action();                           // 들고 있던 날고기는 바로 이어서 꽂기
    }else{setMsg(`앗, 고기 ${cook.n}개가 새까맣게 타버렸다...`);cook=null;}
    return;
  }
  if(inv.raw>0){const n=inv.raw;inv.raw=0;cook={t:0,n};setMsg(`꼬치에 고기 ${n}개를 꽂았다. 지글지글... (${COOK}초)`);}
  else setMsg('구울 고기가 없어요. 작살 버튼으로 사냥해 보세요!');
}
function eat(){
  if(inv.cooked>0){inv.cooked--;inv.eaten++;setMsg('냠냠! 맛있다 (지금까지 먹은 고기 '+inv.eaten+'개)');}
  else setMsg('먹을 구운 고기가 없어요');
}
function updateCook(dt){
  if(!cook)return;
  cook.t+=dt;
  if(!cook.done&&cook.t>=COOK){cook.done=true;setMsg('고기가 다 익었다! 모닥불 옆에서 E 버튼으로 꺼내기');}
  if(!cook.burnt&&cook.t>=BURN){cook.burnt=true;setMsg('고기가 타고 있다!! 빨리 꺼내야 해');}
}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(G.state==='seq')return;                                // 연출 중엔 입력 무시
  if(G.state==='part2'){
    if(G.p2==='ready'){if(e.code==='Space'||e.code==='Enter')p2Start();return;}
    if(G.p2==='lose'){if(e.code==='KeyR'||e.code==='Enter')p2Retry();return;}
    if(G.p2==='end'){if(G.cureT>=END_OV&&(e.code==='KeyR'||e.code==='Enter'))startGame();return;}
    if(e.code==='KeyR'){if(G.p2==='run')p2Retry();}
    else if(e.code==='KeyE'){
      if(G.p2==='done'&&G.bottle&&nearBrown())giveMedicine();
      else if(G.p2==='done'&&G.bottle)setMsg('쓰러진 갈색 토끼 옆으로 가서 E 버튼을 눌러 약병을 주자 (모닥불 쪽 ←)');
      else if(nearRack())swapTool();
      else if(G.p2==='run'&&nearMortar())mortarAction();
      else setMsg(P.tool==='hoe'?'약초를 캐서(괭이 버튼) 절구 옆에서 E 버튼으로 넣자':'도구 걸이 옆에서 E 버튼을 누르면 괭이로 바꿀 수 있어');
    }
    else if(e.code==='Space'||e.code==='KeyJ')swingHoe();
    return;
  }
  if(G.state!=='play'){
    if(e.code==='Enter'||e.code==='KeyR'||(G.state==='ready'&&e.code==='Space'))startGame();
    return;
  }
  if(e.code==='KeyR'){startGame();return;}
  if(e.code==='Space'||e.code==='KeyJ')throwHarpoon();
  else if(e.code==='KeyE')action();
  else if(e.code==='KeyF')eat();
});

      continue;
    }
    const dy=e.hop&&Math.sin(t*3+e.hop*1.7)>0.75?-1:0;
    sprite(e.s,e.m,e.x,e.y+dy,e.flip);
    if(e.flag)drawFlag(e.x+1,e.y,t);
    if(e.grind!==undefined)drawPestle(e,t);
    if(e.chop)drawKnife(e,t);
    if(e.eat)drawBite(e,t);
  }
  if(PART===1)drawBarricade();
  drawHarpoon();
  for(let i=0;i<WW*H;i++)if(fg[i])buf[i]=fg[i];
  // 저해상도(2x2 블록) + 디더링 조명, 카메라에 보이는 영역만
  CX=Math.round(camX);
  const fl=rng(f*31)(), flick=[Math.sin(t*7)*1.5+Math.sin(t*13)+fl*2, Math.sin(t*11)*1.2, Math.sin(t*9+2)*1.2, Math.sin(t*0.7)*2, Math.sin(t*10+1)*1.2, Math.sin(t*0.6+2)*2];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const wx=x+CX, bx=wx>>1, by=y>>1, px=bx*2+1, py=by*2+1;
    let dmin=9;
    for(let j=0;j<LIGHTS.length;j++){const L=LIGHTS[j];const d=Math.hypot(px-L.x,(py-L.y)*1.6)/(L.r+flick[j]);if(d<dmin)dmin=d;}
    let lv=Math.floor(dmin*2.6-0.6+(BAYER[by&3][bx&3]/16-0.47)*0.8);
    let lmin=-1;
    if(px>=300){const s=shaftAt(px,py,t),bv=BAYER[by&3][bx&3];  // 햇살 줄기 (가운데는 더 밝게)
      if(s>0&&s*16>bv){lv--;lmin=-2;} if(s>=1&&bv<10)lv--;}
    lv=Math.max(lmin,Math.min(y<46?1:2,lv));
    let c=buf[y*WW+wx-XMIN];
    if(lv<0)for(let k=0;k<-lv;k++)c=LIGHT[c];else for(let k=0;k<lv;k++)c=DARK[c];
    const i=(y*W+x)*4,q=RGB[c];img.data[i]=q[0];img.data[i+1]=q[1];img.data[i+2]=q[2];img.data[i+3]=255;
  }
  for(const e of embers)put(e.x,e.y,e.life>40?17:e.life>20?18:19);
  for(const s of smokes)put(s.x,s.y,s.life>14?16:15);
  for(const b of flies)if(Math.sin(t*2+b.p)>0.4)put(b.x+Math.sin(t+b.p)*3,b.y+Math.cos(t*0.7+b.p)*2,13);
  if(CX+W>296){                                             // 약초 전장: 햇살 먼지 / 포자 / 약초 부스러기
    for(const m of motes){const mx=m.x+Math.sin(t*0.3+m.p)*4, my=8+((m.y+t*2.5)%96);
      if(shaftAt(mx,my,t)>0.5&&Math.sin(t*1.5+m.p)>-0.2)put(mx,my,Math.sin(t*3+m.p)>0?17:8);}
    for(const s of spores)put(s.x,s.y,s.life>18?8:13);
    for(const s of specks)put(s.x,s.y,s.c||(s.life>2?13:12));
    for(const e of ents)if(e.herb&&Math.sin(t*2.3+e.x*1.7)>0.85)put(e.x+2,e.y-2,17);   // 캘 수 있는 약초 반짝
  }
  drawUI(t);
  ctx.putImageData(img,0,0);
}

let last=0, lastTick=0, frame=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=last?Math.min(0.05,(ts-last)/1000):0; last=ts;
  updatePlayer(dt);                                         // 이동은 매 프레임 (부드럽게)
  updateGame(dt); updatePreys(dt);
  if(G.state==='play'){updateHarpoon(dt);updateCook(dt);}
  if(G.state==='part2')updateHoe(dt);
  camX+=(camTarget()-camX)*Math.min(1,dt*5);                // 카메라가 토끼를 부드럽게 따라감
  if(ts-lastTick>=100){                                     // 불꽃/불씨는 10fps 도트 감성 유지
    lastTick=ts; frame++;
    if(ER()<0.7)embers.push({x:93+ER()*6,y:76,vx:(ER()-0.5)*0.3,vy:-0.5-ER()*0.6,life:40+ER()*25});
    for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.x+=e.vx+Math.sin(e.y*0.3)*0.3;e.y+=e.vy;if(--e.life<=0||e.y<0)embers.splice(i,1);}
    if(cook&&ER()<(cook.t>=BURN?0.9:0.35))smokes.push({x:94+ER()*5,y:68,life:18+ER()*14});   // 굽는 연기
    for(let i=smokes.length-1;i>=0;i--){const s=smokes[i];s.y-=0.45;s.x+=Math.sin(s.y*0.25)*0.35;if(--s.life<=0)smokes.splice(i,1);}
    const tt=ts/1000;
    for(const [x,y] of PODS)if(ER()<0.12)spores.push({x:x-1+ER()*3,y:y-3,p:ER()*6,life:24+ER()*20});
    for(let i=spores.length-1;i>=0;i--){const s=spores[i];s.y-=0.25;s.x+=Math.sin(s.y*0.3+s.p)*0.25;if(--s.life<=0)spores.splice(i,1);}
    if(grinding())for(const g of GRINDERS)if(pestleLift(g,tt)===0&&ER()<0.8)
      specks.push({x:(g.flip?387:380)+ER()*2,y:84,vx:(ER()-0.5)*0.9,vy:-0.6-ER()*0.6,life:3+ER()*3});
    for(let i=specks.length-1;i>=0;i--){const s=specks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=0.3;if(--s.life<=0)specks.splice(i,1);}
  }
  render(ts/1000,frame);
}
placeHerbs();
readyScreen();
requestAnimationFrame(loop);

// ---------- 모바일 터치 조작 (가상 키 입력으로 기존 키보드 로직을 그대로 사용) ----------
const $=id=>document.getElementById(id);
const buzz=()=>{if(navigator.vibrate)navigator.vibrate(12);};
function press(code){keys[code]=true;dispatchEvent(new KeyboardEvent('keydown',{code}));}
function release(code){keys[code]=false;dispatchEvent(new KeyboardEvent('keyup',{code}));}
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});   // 스크롤/확대 막기

// 조이스틱 (왼쪽 아래 영역 아무 곳이나 터치하면 그 자리에 생김)
const zone=$('zone'), stick=$('stick'), knob=$('knob'), RAD=50;
const DIRS=['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'];
let sid=null, sx=0, sy=0;
function placeStick(x,y){stick.style.left=x+'px';stick.style.top=y+'px';}
window.stickHome=function(){
  if(sid!==null)return;
  const port=document.body.classList.contains('port');
  placeStick(port?100:96, innerHeight-(port?150:100));
  stick.style.opacity=.6;
};
function setDir(on){                                        // on: 눌러야 할 방향키 집합
  for(const k of DIRS)if(!!keys[k]!==on.has(k))(on.has(k)?press:release)(k);
}
function moveStick(e){
  let dx=e.clientX-sx, dy=e.clientY-sy;const d=Math.hypot(dx,dy);
  if(d>RAD){dx*=RAD/d;dy*=RAD/d;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  const on=new Set();
  if(d>RAD*0.28){                                           // 8방향
    const sec=((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8;
    if(sec===7||sec===0||sec===1)on.add('ArrowRight');
    if(sec>=1&&sec<=3)on.add('ArrowDown');
    if(sec>=3&&sec<=5)on.add('ArrowLeft');
    if(sec>=5&&sec<=7)on.add('ArrowUp');
  }
  setDir(on);
}
zone.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(sid!==null)return;
  sid=e.pointerId;zone.setPointerCapture(sid);
  sx=e.clientX;sy=e.clientY;placeStick(sx,sy);stick.style.opacity=1;moveStick(e);
});
zone.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
function stickEnd(e){if(e.pointerId!==sid)return;sid=null;setDir(new Set());knob.style.transform='';stickHome();}
zone.addEventListener('pointerup',stickEnd);zone.addEventListener('pointercancel',stickEnd);

// 버튼
function bindBtn(el,code,onDown){
  const up=e=>{if(!el.classList.contains('down'))return;el.classList.remove('down');if(code)release(code);};
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    el.setPointerCapture(e.pointerId);el.classList.add('down');buzz();
    if(onDown)onDown();else press(code);
  });
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
bindBtn($('btnA'),'Space');
bindBtn($('btnE'),'KeyE');
bindBtn($('btnR'),'KeyR');
const fsOK=document.fullscreenEnabled||document.webkitFullscreenEnabled;
if(!fsOK)$('btnFS').style.display='none';                   // 아이폰 사파리 등 전체 화면 미지원
bindBtn($('btnFS'),null,()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
  const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  if(p&&p.then)p.then(()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}).catch(()=>{});
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(fit,150)));

// 안내 화면이 떠 있을 때는 화면 아무 곳이나 터치 = Enter (시작 / 다시 하기)
document.addEventListener('pointerdown',e=>{
  if(ovEl.classList.contains('hide')||e.target.closest('.btn,.sm'))return;
  press('Enter');setTimeout(()=>release('Enter'),50);
});

// 버튼 글자/강조를 상황에 맞게
let lastLab='';
setInterval(()=>{
  const hoe=PART===2&&P.tool==='hoe', lab=hoe?'괭이|캐기':'작살|던지기';
  if(lab!==lastLab){lastLab=lab;const [a,b]=lab.split('|');$('labA').textContent=a;$('subA').textContent=b;}
  $('btnE').classList.toggle('ready',canAct());
  let sub='행동';
  if(G.state==='part2'){
    if(G.p2==='done'&&G.bottle)sub='약 주기';
    else if(nearRack())sub='도구 교체';
    else if(nearMortar())sub=mort?'꺼내기':'넣기';
  }else if(nearFire())sub=cook?'꺼내기':'굽기';
  if($('subE').textContent!==sub)$('subE').textContent=sub;
},100);
fit();
